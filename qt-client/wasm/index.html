<!doctype html>
<!-- Page shell for the WebAssembly build. Replaces Qt's default wasm_shell.html:
     full-viewport canvas, own loading screen, and cross-origin isolation via
     coi-serviceworker.js so the multithreaded build runs on GitHub Pages. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
<meta name="theme-color" content="#2b2b2b">
<meta name="description" content="Daily Hexagonal Puzzle solver — Qt/C solver compiled to WebAssembly.">
<title>Daily Hex Puzzle Solver</title>
<script src="coi-serviceworker.js"></script>
<style>
  html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #2b2b2b;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans JP', sans-serif;
  }
  #screen { width: 100%; height: 100%; display: none; }

  #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 16px;
  }
  #loading h1 { font-size: 20px; font-weight: 600; margin: 0; }
  #status     { font-size: 13px; opacity: .75; }
  #hint       { font-size: 12px; opacity: .5; max-width: 26em; line-height: 1.6; }

  .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255, 255, 255, .2);
      border-top-color: #e0e0e0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h1>Daily Hex Puzzle Solver</h1>
  <div id="status">Loading…</div>
  <div id="hint">約 6&nbsp;MB を読み込みます。初回は数秒かかります。</div>
  <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
</div>
<div id="screen"></div>

<script>
async function init() {
    const loading = document.querySelector('#loading');
    const screen  = document.querySelector('#screen');
    const status  = document.querySelector('#status');

    if (!window.crossOriginIsolated) {
        // coi-serviceworker.js reloads the page once it is in control
        status.textContent = 'Preparing…';
        return;
    }

    try {
        await qtLoad({
            qt: {
                onLoaded: () => {
                    loading.style.display = 'none';
                    screen.style.display  = 'block';
                },
                onExit: exitData => {
                    status.textContent = 'Application exit'
                        + (exitData.code !== undefined ? ` with code ${exitData.code}` : '')
                        + (exitData.text !== undefined ? ` (${exitData.text})` : '');
                    loading.style.display = 'flex';
                    screen.style.display  = 'none';
                },
                entryFunction: window.DailyHexPuzzle_entry,
                containerElements: [screen],
            }
        });
    } catch (e) {
        console.error(e);
        status.textContent = 'Failed to start: ' + e;
    }
}
</script>
<script src="DailyHexPuzzle.js"></script>
<script src="qtloader.js"></script>
<script>init();</script>
</body>
</html>
